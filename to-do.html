<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Quest Mission Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tracker" id="trackerBox">
    <div class="top-bar">
      <h1>Campus Quest Mission Tracker</h1>
      <button class="change-color" onclick="changeColor()">Change Color</button>
    </div>

    <div class="stats">
      <div class="stat total">Total: <span id="total">0</span></div>
      <div class="stat completed">Completed: <span id="completed">0</span></div>
      <div class="stat pending">Pending: <span id="pending">0</span></div>
    </div>

    <ul class="mission-list" id="missionList"></ul>

    <div class="add-section">
      <input type="text" id="missionInput" placeholder="Enter a mission...">
      <button onclick="addMission()">+ Add Mission</button>
    </div>
  </div>

  <script>
    const missionList = document.getElementById('missionList');
    const totalEl = document.getElementById('total');
    const completedEl = document.getElementById('completed');
    const pendingEl = document.getElementById('pending');
    const trackerBox = document.getElementById('trackerBox');

    function updateStats() {
      const missions = document.querySelectorAll('.mission-item');
      const completed = document.querySelectorAll('.mission-item.completed');
      totalEl.textContent = missions.length;
      completedEl.textContent = completed.length;
      pendingEl.textContent = missions.length - completed.length;
    }

    function addMission() {
      const input = document.getElementById('missionInput');
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.className = 'mission-item';
      li.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;">
          <input type="checkbox" onchange="toggleComplete(this)">
          <span>${text}</span>
        </div>
        <button onclick="deleteMission(this)">Delete</button>`;
      missionList.appendChild(li);
      input.value = '';
      updateStats();
    }

    function toggleComplete(checkbox) {
      const item = checkbox.closest('.mission-item');
      item.classList.toggle('completed', checkbox.checked);
      updateStats();
    }

    function deleteMission(btn) {
      btn.parentElement.remove();
      updateStats();
    }

    function changeColor() {
  trackerBox.style.backgroundColor = '#e6f2ff'; 
}
  </script>
</body>
</html>
